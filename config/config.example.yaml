# AutoShorts v1.3
app:
  name: "AutoShorts-OnDevice"
  version: "1.3.0"
  port: 8765
  host: "127.0.0.1"
  auto_open_browser: true

# Tooling Constraints:
# - Video downloading: Exclusively yt-dlp (with --download-sections).
# - Video rendering/compositing: Exclusively FFmpeg + ffprobe (zero MoviePy).
# - Browser automation: Exclusively Playwright for YouTube Studio upload/verification fallback.

llm:
  provider: "local"                # "local", "gemini", or "openrouter"
  model: null                      # null = use provider default (resolved dynamically at runtime)
  local_model_path: "data/models/Qwen3-0.6B-Instruct-Q8_0.gguf"
  n_threads: 4                     # Bounded for CPU execution
  temperature: 0.0

job_defaults:
  clips_per_video: 1
  min_duration_seconds: 30
  max_duration_seconds: 50
  window_stride_seconds: 15
  focus_prompt: "Identify the most compelling, high-retention standalone insight or moment."
  background_category: "minecraft" # "minecraft", "subway", or "auto"
  dopamine_level: "medium"         # "low", "medium", "high"
  auto_approve: false              # Require human dashboard confirmation before upload

edit_planner:
  enabled: true                    # Multimodal AI edit planning
  provider: "gemini_video"         # Uses Gemini Files API video understanding
  model: null                      # Resolved at runtime to Gemini multimodal default
  fallback_to_transcript: true     # If API fails/unavailable, fall back to SemIf text planning
  max_video_duration_for_analysis_sec: 180

scheduler:
  enabled: true                    # Persistent upload pacing engine
  daily_upload_cap: 40             # Hard maximum Shorts uploaded per quota day (40 Shorts per day)
  max_per_rolling_hour: 7          # Anti-burst ceiling: max 7 uploads in any 60-minute window
  min_gap_minutes: 5               # Minimum uniform random delay between uploads
  max_gap_minutes: 25              # Maximum uniform random delay between uploads
  active_window:
    start: "08:00"                 # Start of active upload window (local time)
    end: "23:59"                   # End of active upload window (local time)
    timezone: "local"
  quota_reset_timezone: "America/Los_Angeles" # YouTube quota resets midnight Pacific Time
  prevent_sleep: true              # Win32 SetThreadExecutionState while slots are pending
  catch_up_policy: "reschedule_respect_rate_limit" # Skip missed slots on PC wake; do not burst
  originality:                     # Guardrails vs YouTube "inauthentic content" enforcement
    enabled: true
    max_daily_uploads: 12          # Stricter than daily_upload_cap; the lower of the two applies
    max_title_similarity: 0.7      # Flag titles this similar (word overlap) to recent uploads
    similarity_lookback: 30        # How many recent uploads to compare against
    block_similar: false           # true = push near-duplicates back ~4h instead of only flagging

quota:
  upload_bucket_daily: 100         # Dedicated videos.insert daily quota bucket (calls/day)
  general_bucket_daily: 10000      # Shared general API daily quota bucket (units/day)
  reserve_retries: 50              # Headroom reserved in upload bucket for retries/resumes
  insert_cost_units: 1             # videos.insert cost per call in the upload bucket
  list_cost_units: 1               # videos.list verification poll cost in general bucket
  stop_threshold_units: 100        # General bucket reserve threshold
  exhaustion_fallback: "queue_next_day" # "queue_next_day", "studio", or "local"

spark:
  inbox_dir: "inbox"               # Monitored drop directory for Gemini Spark companion
  watch_inbox: true                # Watch inbox for incoming .json/.yaml instruction files
  poll_interval_sec: 10            # Ingestion polling frequency

media:
  preferred_encoder: "auto"        # "auto" (probes h264_qsv then libx264), "h264_qsv", "libx264"
  whisper_model: "base.en"         # "tiny.en" or "base.en" (CPU int8)
  fps: 30
  crf: 22
  preset: "veryfast"
  generate_lowres_preview: true    # Renders 540x960 fast preview for dashboard

subtitles:
  style_preset: "neon"             # "neon", "minimal", "pill", "hormozi", "mrbeast", "cyberpunk", "cinematic", "rapid"
  font_name: "Montserrat ExtraBold"
  font_size: 76
  words_per_burst: 3
  karaoke_highlight: true
  active_color: "&H0000FFFF"       # Vibrant Yellow
  primary_color: "&H00FFFFFF"      # White
  emphasis_color: "&H00FFF000"     # Cyan / Emphasis Glow
  outline_color: "&H00000000"      # Black
  safe_zone_margin_v: 780          # Centers over 960px boundary
  karaoke_pop_scale: 118           # Word pop scale percent (e.g. 118 for 1.18x)
  caption_engine: "ass"            # "ass" (FFmpeg burn-in) or "remotion" (needs the remotion/ npm install)
  text_transform: "uppercase"      # "uppercase", "title", "none"
  position: "center"               # "bottom_safe", "center", "top_safe"
  hook_banner_style: "neon_box"    # "neon_box", "pill", "minimal", "none"
  enable_emojis: true              # Segoe UI Emoji inline rendering

branding:
  layout_mode: "split_50_50"       # "split_50_50", "split_70_30", "full_blur_bg", "full_center_crop", "pip_gameplay", "cam_gameplay"
  color_grading: "none"            # "none", "vibrant", "cinematic", "warm", "crisp"
  watermark_text: null             # Channel watermark text (e.g. "@MyChannel")
  watermark_position: "top_right"  # "top_right", "top_left", "bottom_right", "bottom_center"
  watermark_opacity: 0.65          # 0.1 to 1.0
  progress_bar_position: "seam"    # "top", "bottom", "seam", "none"
  progress_bar_color: "#FFE600"    # Progress bar hex color
  progress_bar_height: 12          # Height in pixels (4 to 24)
  hook_opener: "none"              # "none", "zoom_burst", "flash"
  outro_cta_text: null             # Optional 2-second outro CTA badge
  # Used when layout_mode is "cam_gameplay": streamer camera on the top panel, gameplay below.
  # No gameplay background is fetched for this layout. All rects are normalized x, y, w, h (0..1).
  cam_layout:
    top_ratio: 0.5                 # Share of the 1920px height for the camera panel (0.2 to 0.8)
    cam_source: "crop"             # "crop" = facecam overlay inside the source, "file" = separate camera recording
    cam_rect: null                 # e.g. [0.72, 0.62, 0.26, 0.34] bottom-right webcam; null = auto-detect
    cam_file: null                 # Camera recording path when cam_source is "file"
    gameplay_rect: null            # Gameplay region of the source; null = whole frame
    mirror_cam: false              # Flip the camera panel horizontally
    auto_detect: true              # Find the facecam with OpenCV when cam_rect is null (needs opencv-python)

audio_mastering:
  voice_boost: true                # Highpass filter + vocal presence EQ boost
  target_lufs: -14.0               # YouTube Shorts loudness parity target (-24.0 to -9.0 LUFS)
  bg_music_volume: 0.20            # Background music ducking volume (0.0 to 0.50)
  enable_sfx: true                 # Event-synced whoosh / pop transition SFX

upload:
  mode: "api"                      # "api" (Data API v3), "studio" (Playwright Edge), "local" (export only)
  default_privacy_status: "public" # "private", "unlisted", "public"
  privacy_status: "public"         # "private", "unlisted", "public"
  category_id: "24"                # 20: Gaming, 22: People & Blogs, 24: Entertainment, 27: Education, 28: Sci & Tech
  default_language: "en"           # Video language code
  altered_content: false           # Synthetic / Altered Media disclosure checkbox
  custom_tags: []                  # Additional tags for upload
  auto_pin_comment: false          # Automatically post and pin attribution comment
  pin_comment_template: "📌 Watch the full video by {channel}: {video_url}"
  playlist_id: null                # Optional YouTube Playlist ID to append upload to
  link_related_video: true         # Link related long-form video in YouTube Studio
  schedule_strategy: "local_scheduler" # "local_scheduler" or "youtube_publish_at"
  active_channel_profile: "default" # Active multi-channel profile id
  title_template: "{hook} | {channel} #Shorts"
  description_template: |
    {hook}

    ---
    📌 ORIGINAL SOURCE ATTRIBUTION:
    This video is an educational commentary clip excerpted from:
    Video Title: "{title}"
    Original Creator: {channel}
    Original Video: {video_url}
    Channel Link: {channel_url}

    All rights and intellectual property belong to {channel}. If you are the copyright owner and wish for this clip to be removed or modified, please contact the channel owner.

    #Shorts #Podcasts #Education {hashtags}

cleanup:
  enabled: true
  use_recycle_bin: false           # Permanently delete to immediately free up local PC disk space
  keep_master_mp4: false           # Purge local output/ master MP4 once successfully uploaded & verified
  keep_final_days: 0               # 0 days retention
  purge_intermediate_work: true
  dry_run: false

retention:
  enabled: true                    # Auto-prune work/ directory to reclaim disk space
  work_max_age_days: 14            # Max age in days before pruning old job working dirs
  work_max_total_gb: 20            # Max total disk size (GB) allowed for work/ before pruning oldest
  keep_last_n: 10                  # Always retain the N most recent run folders regardless of age
  dry_run: true                    # Safe default: simulate cleanup. Set dry_run: false to enable live deletion.
  # Retention for rendered files in output/ (*_master.mp4, *_preview.mp4). Off by default.
  # Files are moved to the Recycle Bin, never permanently deleted. Jobs not yet
  # uploaded/verified are always kept. Only the expiry helper reads these fields;
  # nothing runs it automatically.
  output_enabled: false
  output_max_age_days: 14          # Select output files older than this many days
  output_max_total_gb: 20          # Then delete oldest remaining files until output/ is at or under this size (GB)

pipeline:
  concurrency: 3                   # Max concurrent rendering and processing workers
  caption_engine: "ass"            # Caption generator engine ("ass" or "remotion")
  enable_delivery_qc: true         # Run automatic FFmpeg delivery QC checks on completed renders

render:
  method: "auto"                   # auto (raea -> remotion -> ffmpeg), raea, remotion, or ffmpeg
  methods: []                      # Methods for multi-method batches, e.g. ["raea", "ffmpeg"]
  strategy: "single"               # single | round_robin (one method per job) | variants (every method per clip)
  fallback: true                   # Fall through the chain when the chosen method fails
  max_parallel_per_method:         # Concurrent renders per method (heavy renderers must not oversubscribe)
    raea: 1
    remotion: 1
    ffmpeg: 2
  # variants: the first entry of `methods` is the primary file (job.rendered_video_path, used by
  # upload); the other methods are written to output/<job>/<method>.mp4 for comparison.

# raea: primary renderer for finished 9:16 shorts (src/autoshorts/media/raea_renderer.py, raea/ dir).
# Falls back to Remotion, then FFmpeg when raea is missing or fails. See raea/README.md.
raea:
  enabled: true                    # false = never try raea
  binary: null                     # Path to the raea executable; null = $AUTOSHORTS_RAEA_BIN, PATH, ~/.raea/bin
  timeout_sec_per_clip_sec: 12.0   # Render timeout = max(120, clip seconds x this + 60)
  run_check: false                 # Run `raea check` on the output and log its findings
  extra_args: []                   # Extra `raea render` args, e.g. ["--quality", "high"]

integrations:
  eachlabs:
    enabled: false                 # Enable EachLabs audio and music synthesis
    model: "mureka-generate-music" # Model identifier for EachLabs generation

# Historical analytics -> clip ranking (src/autoshorts/decider/performance_prior.py).
# Off by default. Stays inactive until min_videos analytics rows exist, so a fresh install ranks as before.
analytics_priors:
  enabled: false                   # Let past Shorts performance nudge candidate scores
  min_videos: 10                   # Analytics rows with a usable clip needed before any prior applies
  min_group_samples: 3             # Rows needed in a length or hook group before that group counts
  shrinkage_m: 2.0                 # Pseudo-count pulling small groups toward the channel average
  max_score_adjustment: 0.05       # Hard cap on how far a prior can move one candidate score (0 to 0.25)
  adaptive_thresholds: true        # Report advisory approve/patch hook thresholds fitted from history
  threshold_max_shift: 5.0         # Advisory thresholds may move at most this far from the defaults
  threshold_min_lift: 3.0          # Minimum SVS lift a hook split needs before thresholds move

# API Keys & Secrets (Set in .env or environment variables):
# GEMINI_API_KEY: "AIzaSy..."
# OPENROUTER_API_KEY: "sk-or-v1-..."
# YOUTUBE_API_KEY: "AIzaSy..."
# EACHLABS_API_KEY: "el-..."
# PEXELS_API_KEY: "..."
# PIXABAY_API_KEY: "..."
